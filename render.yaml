services:
  - type: web
    name: lando-backend
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install && npx prisma migrate deploy --schema=apps/backend/prisma/schema.prisma
    startCommand: npm run start --workspace=apps/backend
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MARKETPLACE_REGION
        value: KANDY
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL
        value: 30d
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: BACKEND_PUBLIC_URL
        sync: false
